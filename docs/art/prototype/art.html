<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#e9e4d6;display:flex;flex-wrap:wrap;gap:24px;padding:24px;font-family:Inter,Helvetica,Arial,sans-serif}
canvas{border-radius:14px;box-shadow:0 6px 24px rgba(9,22,35,.25)}
</style></head><body>
<canvas id="a0" width="400" height="600"></canvas>
<canvas id="a1" width="400" height="600"></canvas>
<canvas id="a2" width="400" height="600"></canvas>
<canvas id="a3" width="400" height="600"></canvas>
<script>
const C={green:"#113b31",cream:"#f5f0e3",ink:"#091623",gold:"#f8d084",cyan:"#18dccb"};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedOf(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function mix(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")})`}
const SKIES={dawn:["#7fb7c4","#f8d084"],day:["#5aa6c2","#cfe7e6"],dusk:["#2b4a6b","#f3a86b"],night:["#091623","#1c3550"]};
function ridge(rnd,peaks,w,base,amp){const pts=[];for(let x=0;x<=w;x+=4){let y=0;for(const p of peaks){const d=(x/w-p.x)/p.r;y=Math.max(y,p.h*Math.exp(-d*d))}y+=0.06*Math.sin(x*0.05+peaks[0].x*20)*(rnd()*0.3+0.85);pts.push([x,base-y*amp])}return pts}
function tree(g,x,y,h,col){g.fillStyle=col;const w=h*0.42;for(let i=0;i<3;i++){const t=y-h*(0.28*i);g.beginPath();g.moveTo(x,t-h*0.45);g.lineTo(x-w*(1-i*0.22)/2,t);g.lineTo(x+w*(1-i*0.22)/2,t);g.closePath();g.fill()}g.fillRect(x-h*0.03,y,h*0.06,h*0.08)}
function roots(g,rnd,x,y,len,ang,depth){if(depth<=0||len<4)return;const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len;g.lineWidth=Math.max(0.7,depth*0.7);g.beginPath();g.moveTo(x,y);g.quadraticCurveTo((x+x2)/2+(rnd()-.5)*len*.5,(y+y2)/2,x2,y2);g.stroke();const n=rnd()<0.35?3:2;for(let i=0;i<n;i++)roots(g,rnd,x2,y2,len*(0.62+rnd()*0.2),ang+(rnd()-.5)*1.3,depth-1)}

// The fingerprint: the stars' shape from the record (credential commitment or paystub hash), and
// one brighter star, the person's own, at the same place in every constellation (from their name).
// The person's constellation: its whole shape from their name.hewn, so it is the same on every
// card and paystub of theirs. The record lights one of its stars (from the record's commitment):
// that is what differs from card to card.
function constellation(g,recordSeed,name,box,night){
  const me=mulberry(seedOf("name:"+name)),rec=mulberry(seedOf(recordSeed));
  const n=6+Math.floor(me()*3),pts=[];let guard=0;
  while(pts.length<n&&guard++<600){const x=me(),y=me();if(pts.some(([a,b])=>Math.hypot(a-x,(b-y)*0.6)<0.16))continue;pts.push([x,y])}
  const order=[pts[0]],left=pts.slice(1);while(left.length){const last=order.at(-1);let k=0;left.forEach((p,i)=>{if(Math.hypot(p[0]-last[0],p[1]-last[1])<Math.hypot(left[k][0]-last[0],left[k][1]-last[1]))k=i});order.push(left.splice(k,1)[0])}
  const P=([x,y])=>[box.x+x*box.w,box.y+y*box.h];
  g.strokeStyle=night?"rgba(24,220,203,.75)":"rgba(17,120,112,.6)";g.lineWidth=1;g.beginPath();order.map(P).forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
  const lit=Math.floor(rec()*order.length);
  order.map(P).forEach(([x,y],i)=>{if(i===lit){g.fillStyle=night?"rgba(24,220,203,.28)":"rgba(26,143,133,.22)";g.beginPath();g.arc(x,y,7,0,7);g.fill();g.fillStyle=night?"#bffcf5":C.cyan;g.beginPath();g.arc(x,y,3,0,7);g.fill();g.strokeStyle=night?"#bffcf5":C.cyan;g.beginPath();g.moveTo(x-7,y);g.lineTo(x+7,y);g.moveTo(x,y-7);g.lineTo(x,y+7);g.stroke()}else{g.fillStyle=night?C.cyan:"#1a8f85";g.beginPath();g.arc(x,y,1.9,0,7);g.fill()}});
}

const KEYS=[[0,"#060f1a","#14273c"],[5,"#0b1a2b","#22395a"],[6.5,"#7fa4c0","#f6c886"],[8.5,"#5aa6c2","#cfe7e6"],[16,"#5aa6c2","#d6ece6"],[18.5,"#3a557a","#f2a46b"],[20,"#0e1e33","#2a4060"],[24,"#060f1a","#14273c"]];
function skyAt(h){for(let i=0;i<KEYS.length-1;i++){const [a,a1,a2]=KEYS[i],[b,b1,b2]=KEYS[i+1];if(h>=a&&h<=b){const t=(h-a)/(b-a);return [mix(a1,b1,t),mix(a2,b2,t)]}}return [KEYS[0][1],KEYS[0][2]]}
const toHex=c=>{const m=c.match(/\d+/g).map(Number);return "#"+m.map(v=>v.toString(16).padStart(2,"0")).join("")};

// A business's card: the view from its own hill, down a valley. Its cyan pine stands on the crest and
// grows with its time on Hewn; its constellation comes from its name. Same live sky and seasons.
function businessCard(id,o){
  const cv=document.getElementById(id),g=cv.getContext("2d"),W=400,H=600,rnd=mulberry(seedOf("biz:"+o.name));
  g.fillStyle=C.cream;g.fillRect(0,0,W,H);g.fillStyle=C.green;g.fillRect(0,0,W,58);g.fillStyle=C.cream;g.font="600 18px Inter";g.fillText(o.name,20,36);
  g.textAlign="right";g.fillStyle=C.cyan;g.font="500 11px Inter";g.fillText(o.kind.toUpperCase(),W-20,36);g.textAlign="left";
  const top=58,bottom=480;g.save();g.beginPath();g.rect(14,top+14,W-28,bottom-top-14);g.clip();
  const h=o.hour,isNight=h<5.8||h>19.6,[s1,s2]=skyAt(h).map(toHex);const horizon=250;
  const sky=g.createLinearGradient(0,top,0,horizon);sky.addColorStop(0,s1);sky.addColorStop(1,s2);g.fillStyle=sky;g.fillRect(0,top,W,horizon-top+40);
  let sx,sy;const arc=(t)=>[30+t*(W-60),horizon-10-Math.sin(Math.PI*t)*(horizon-top-60)];
  if(!isNight){[sx,sy]=arc((h-5.8)/(19.6-5.8));const warm=h<8||h>17.5;g.fillStyle=warm?C.gold:"#fff6d8";g.beginPath();g.arc(sx,sy,warm?26:19,0,7);g.fill()}
  else{const t=((h<12?h+24:h)-19.6)/(24+5.8-19.6);[sx,sy]=arc(t);const sr=mulberry(11);for(let i=0;i<70;i++){g.fillStyle=`rgba(245,240,227,${0.25+sr()*0.6})`;g.fillRect(sr()*W,top+sr()*(horizon-top-30),1.4,1.4)}
    g.fillStyle=C.cream;g.beginPath();g.arc(sx,sy,13,0,7);g.fill();g.fillStyle=s1;g.beginPath();g.arc(sx+8,sy-3,12,0,7);g.fill()}
  const FAR=isNight?"#2c4560":"#8fb3bd";
  // the far side of the valley: low ranges fading into the distance
  const sky_=new Array(W+1).fill(horizon);
  for(let l=0;l<3;l++){const peaks=Array.from({length:2+Math.floor(rnd()*3)},()=>({x:rnd(),r:0.1+rnd()*0.2,h:0.3+rnd()*0.7}));const base=horizon+l*14,amp=70-l*18;const pts=ridge(rnd,peaks,W,base,amp);
    for(const [x,y] of pts)for(let k=0;k<4&&x+k<=W;k++)sky_[x+k]=Math.min(sky_[x+k],y);
    g.fillStyle=mix(FAR,isNight?"#1a3040":"#4f7d7a",l/2);g.beginPath();g.moveTo(0,H);for(const [x,y] of pts)g.lineTo(x,y);g.lineTo(W,H);g.fill();
    if(o.season==="winter"&&l===0){g.save();g.clip();g.fillStyle="rgba(245,240,227,.85)";g.fillRect(0,0,W,Math.min(...pts.map(p=>p[1]))+amp*0.5);g.restore()}}
  // the valley floor, a river winding away (cream water, never cyan), and fields
  const floor=horizon+40;const valley={winter:"#d6dcd9",spring:"#3f6f4f",summer:"#2f5d43",autumn:"#7a6a3a"}[o.season];
  // the floor recedes into haze toward the far side
  const vg=g.createLinearGradient(0,floor,0,bottom);vg.addColorStop(0,mix(valley,isNight?"#1a3040":"#a9c4c6",0.55));vg.addColorStop(0.5,valley);vg.addColorStop(1,valley);g.fillStyle=vg;g.fillRect(0,floor-2,W,H);
  const fr=mulberry(seedOf("fields:"+o.name));for(let i=0;i<16;i++){const fy=floor+8+fr()*120,d=(fy-floor)/120;g.fillStyle=`rgba(0,0,0,${0.03+fr()*0.05})`;g.beginPath();g.ellipse(fr()*W,fy,(14+fr()*30)*(0.5+d),(2+fr()*4)*(0.5+d),0,0,7);g.fill()}
  // the river: a thread at the far side, widening as it winds toward the hill (water, never cyan)
  const water=isNight?"#3a5570":mix(s2,"#9fc3cf",0.5);let rx=W*(0.3+rnd()*0.4),ry=floor+2;const side=[];
  for(let i=0;i<=16;i++){const t=i/16;rx+=Math.sin(i*0.9+rnd()*0.6)*14*(0.4+t*1.6);ry=floor+2+t*t*170;side.push([rx,ry,0.8+t*t*18])}
  g.fillStyle=water;g.beginPath();side.forEach(([x,y,w],i)=>i?g.lineTo(x-w,y):g.moveTo(x-w,y));side.slice().reverse().forEach(([x,y,w])=>g.lineTo(x+w,y));g.closePath();g.fill();
  g.strokeStyle="rgba(245,240,227,.35)";g.lineWidth=1;g.beginPath();side.forEach(([x,y,w],i)=>i?g.lineTo(x-w*0.3,y):g.moveTo(x-w*0.3,y));g.stroke();
  // trees scattered down the valley
  for(let i=0;i<26;i++){const tx=rnd()*W,ty=floor+rnd()*150,th=6+((ty-floor)/150)*18;tree(g,tx,ty,th,o.season==="autumn"&&rnd()<0.3?"#c9922f":mix("#1f4a3f","#0e3329",rnd()))}
  // the business's own hill in front, with its pine on the crest
  const crestX=W*(0.25+rnd()*0.5),crestY=bottom-78;g.fillStyle={winter:"#e6eae8",spring:"#163f31",summer:"#123528",autumn:"#3a3a22"}[o.season];
  g.beginPath();g.moveTo(-10,bottom);g.quadraticCurveTo(crestX*0.5,crestY+30,crestX,crestY);g.quadraticCurveTo(crestX+(W-crestX)*0.5,crestY+20,W+10,bottom-10);g.lineTo(W+10,bottom+10);g.lineTo(-10,bottom+10);g.fill();
  if(o.season==="spring"){const fl=mulberry(seedOf("hill:"+o.name));for(let i=0;i<30;i++){g.fillStyle=["#f5f0e3","#f8d084","#c9a0dc"][Math.floor(fl()*3)];g.beginPath();g.arc(fl()*W,bottom-6-fl()*40,1.5,0,7);g.fill()}}
  tree(g,crestX,crestY+4,60+o.tenure*12,C.cyan);
  // its constellation, in the sky only
  const night=isNight||h<8||h>17.5;const fits=(bx,by,bw,bh)=>{for(let x2=bx;x2<=bx+bw;x2+=4)if(by+bh>sky_[x2]-20)return false;return Math.hypot(Math.max(bx,Math.min(sx,bx+bw))-sx,Math.max(by,Math.min(sy,by+bh))-sy)>34};
  let spot=null;for(const sc of [1,0.8,0.62])for(const by of [top+22,top+34])for(const f of [0,0.25,0.5,0.75,1]){const bw=140*sc,bh=70*sc,bx=Math.round(40+f*(W-80-bw));if(!spot&&fits(bx,by,bw,bh))spot={x:bx,y:by,w:bw,h:bh}}
  if(spot)constellation(g,"biz-card:"+o.name,o.name,spot,night);
  g.restore();g.strokeStyle=C.green;g.lineWidth=2;g.strokeRect(14,top+14,W-28,bottom-top-14);
  g.fillStyle=C.ink;g.font="600 16px Inter";g.fillText(o.title,20,515);g.font="13px Inter";g.fillStyle="#43514c";g.fillText(o.line,20,538);
  g.font="11px ui-monospace,Menlo,monospace";g.fillStyle="#6b7a74";g.fillText(o.fp,20,575);g.textAlign="right";g.fillStyle=C.green;g.font="600 11px Inter";g.fillText("hewn · on Aleo since 2026",W-20,575);g.textAlign="left";
}

// A business's card: its land as a topographic map (Joshua's original idea, in Hewn's colours), the
// cross-section below. The terrain comes from its name; its cyan pine marks the summit and grows with
// its time on Hewn; its constellation sits in the map's corner. Live: the hillshade is lit from the
// real sun; at night the map turns to dark paper with cream lines. Seasons tint the land.
function topoCard(id,o){
  const cv=document.getElementById(id),g=cv.getContext("2d"),W=400,H=600,rnd=mulberry(seedOf("topo:"+o.name));
  const h=o.hour,night=h<5.8||h>19.6;
  const paper=night?"#0e1b2a":C.cream,ink=night?"#e9e2cf":C.green;
  g.fillStyle=C.cream;g.fillRect(0,0,W,H);g.fillStyle=C.green;g.fillRect(0,0,W,58);g.fillStyle=C.cream;g.font="600 18px Inter";g.fillText(o.name,20,36);
  g.textAlign="right";g.fillStyle=C.cyan;g.font="500 11px Inter";g.fillText("BUSINESS",W-20,36);g.textAlign="left";
  const MX=14,MY=72,MW=W-28,MH=290;g.fillStyle=paper;g.fillRect(MX,MY,MW,MH);
  // heightmap: a few peaks plus soft noise
  const GW=96,GH=70,peaks=Array.from({length:2+Math.floor(rnd()*3)},()=>({x:0.15+rnd()*0.7,y:0.15+rnd()*0.7,h:0.5+rnd()*0.5,r:0.12+rnd()*0.18}));
  const nz=Array.from({length:6},()=>[rnd()*6.28,1+rnd()*3,1+rnd()*3,rnd()*0.06]);
  const hm=[];let top=0,topAt=[0,0];
  for(let j=0;j<=GH;j++){hm[j]=[];for(let i=0;i<=GW;i++){const u=i/GW,v=j/GH;let z=0;for(const p of peaks){const d=Math.hypot((u-p.x)/p.r,(v-p.y)/p.r);z+=p.h*Math.exp(-d*d)}
    for(const [ph,fx,fy,a] of nz)z+=a*Math.sin(u*fx*6+ph)*Math.cos(v*fy*6-ph);hm[j][i]=z;if(z>top){top=z;topAt=[i,j]}}}
  const X=i=>MX+i/GW*MW,Y=j=>MY+j/GH*MH;
  // seasonal tint by elevation and the hillshade lit from where the sun really is, painted small then
  // scaled up smooth, so no grid shows
  const lay=document.createElement("canvas");lay.width=GW;lay.height=GH;const lg=lay.getContext("2d"),img=lg.createImageData(GW,GH);
  const low={spring:[90,150,95,40],summer:[45,115,75,55],autumn:[200,150,70,55],winter:[120,150,170,30]}[o.season],high={spring:[245,240,227,0],summer:[140,160,90,30],autumn:[160,110,55,35],winter:[255,255,255,190]}[o.season];
  const az=Math.PI*(1-(h-5.8)/(19.6-5.8)),lx=Math.cos(az),ly=-0.6;
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const z=hm[j][i]/top,t=Math.max(0,Math.min(1,(z-0.45)/0.25));let c=low.map((v,k)=>v+(high[k]-v)*t);
    if(!night&&i&&j){const sh=((hm[j][i]-hm[j][i-1])*lx+(hm[j][i]-hm[j-1][i])*ly)*14;if(sh>0){const k=Math.min(0.5,sh);c=[c[0]*(1-k)+17*k,c[1]*(1-k)+59*k,c[2]*(1-k)+49*k,Math.max(c[3],k*120)]}}
    const q=(j*GW+i)*4;img.data[q]=c[0];img.data[q+1]=c[1];img.data[q+2]=c[2];img.data[q+3]=night&&o.season!=="winter"?c[3]*0.4:c[3]}
  lg.putImageData(img,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";g.drawImage(lay,MX,MY,MW,MH);
  // contours by marching squares; every fifth one heavier
  const levels=12;for(let k=1;k<levels;k++){const t=top*k/levels;g.strokeStyle=ink;g.globalAlpha=k%4===0?0.9:0.5;g.lineWidth=k%4===0?1.4:0.8;g.beginPath();
    for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const a=hm[j][i],b=hm[j][i+1],c=hm[j+1][i+1],d=hm[j+1][i];const e=(p,q,x1,y1,x2,y2)=>{const f=(t-p)/(q-p);return[x1+(x2-x1)*f,y1+(y2-y1)*f]};
      const pts=[];if((a<t)!==(b<t))pts.push(e(a,b,X(i),Y(j),X(i+1),Y(j)));if((b<t)!==(c<t))pts.push(e(b,c,X(i+1),Y(j),X(i+1),Y(j+1)));if((c<t)!==(d<t))pts.push(e(c,d,X(i+1),Y(j+1),X(i),Y(j+1)));if((d<t)!==(a<t))pts.push(e(d,a,X(i),Y(j+1),X(i),Y(j)));
      for(let q=0;q+1<pts.length;q+=2){g.moveTo(...pts[q]);g.lineTo(...pts[q+1])}}g.stroke()}
  g.globalAlpha=1;
  if(o.mark==="contour"){const t=top*Math.min(0.9,0.12+o.tenure*0.1);g.strokeStyle=C.cyan;g.lineWidth=2.4;g.beginPath();
    for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const a=hm[j][i],b=hm[j][i+1],c=hm[j+1][i+1],d=hm[j+1][i];const e=(p,q,x1,y1,x2,y2)=>{const f=(t-p)/(q-p);return[x1+(x2-x1)*f,y1+(y2-y1)*f]};
      const pts=[];if((a<t)!==(b<t))pts.push(e(a,b,X(i),Y(j),X(i+1),Y(j)));if((b<t)!==(c<t))pts.push(e(b,c,X(i+1),Y(j),X(i+1),Y(j+1)));if((c<t)!==(d<t))pts.push(e(c,d,X(i+1),Y(j+1),X(i),Y(j+1)));if((d<t)!==(a<t))pts.push(e(d,a,X(i),Y(j+1),X(i),Y(j)));
      for(let q=0;q+1<pts.length;q+=2){g.moveTo(...pts[q]);g.lineTo(...pts[q+1])}}g.stroke()}
  if(o.mark==="trail"){ // from the valley edge toward the summit, one waypoint per year
    const [ti2,tj2]=topAt;let x=X(Math.round(GW*0.08)),y=Y(Math.round(GH*0.9));const ex=X(ti2),ey=Y(tj2);const steps=8;g.strokeStyle=C.cyan;g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.moveTo(x,y);
    const wp=[];for(let k=1;k<=steps;k++){const t=k/steps,nx=x+(ex-x)*t+Math.sin(k*1.7)*18*(1-t),ny=y+(ey-y)*t+Math.cos(k*1.3)*14*(1-t);if(k<=o.tenure)wp.push([nx,ny]);if(k<=o.tenure)g.lineTo(nx,ny)}g.stroke();g.setLineDash([]);
    g.fillStyle=C.cyan;for(const [wx,wy] of wp){g.beginPath();g.arc(wx,wy,3,0,7);g.fill()}
    g.strokeStyle=ink;g.lineWidth=1;g.beginPath();g.moveTo(ex-6,ey+5);g.lineTo(ex,ey-6);g.lineTo(ex+6,ey+5);g.closePath();g.stroke();}
  // a grid, a north arrow and a scale, as on a survey map
  g.strokeStyle=night?"rgba(233,226,207,.12)":"rgba(17,59,49,.10)";g.lineWidth=0.6;for(let x=MX;x<=MX+MW;x+=MW/6){g.beginPath();g.moveTo(x,MY);g.lineTo(x,MY+MH);g.stroke()}for(let y=MY;y<=MY+MH;y+=MH/5){g.beginPath();g.moveTo(MX,y);g.lineTo(MX+MW,y);g.stroke()}
  g.fillStyle=ink;g.font="600 10px Inter";g.fillText("N",MX+12,MY+MH-30);g.beginPath();g.moveTo(MX+15,MY+MH-44);g.lineTo(MX+11,MY+MH-34);g.lineTo(MX+19,MY+MH-34);g.fill();
  g.fillRect(MX+30,MY+MH-14,40,2);g.font="9px ui-monospace,Menlo";g.fillText("1 km",MX+74,MY+MH-10);
  // the summit: the business's cyan pine, larger with each year on Hewn
  const [ti,tj]=topAt;g.font="9px ui-monospace,Menlo,monospace";g.fillStyle=ink;g.fillText(`${Math.round(1200+top*800)} m`,X(ti)+12,Y(tj)+8);
  // its constellation in the corner, from its name
  constellation(g,"topo-card:"+o.name,o.name,{x:MX+MW-128,y:MY+12,w:112,h:56},night);
  g.strokeStyle=C.green;g.lineWidth=2;g.strokeRect(MX,MY,MW,MH);
  // the cross-section through the summit, hatched, the pine standing on it
  const PY=372,PH=100;g.fillStyle=C.cream;g.fillRect(MX,PY,MW,PH);const row=hm[tj];const py=i=>PY+PH-8-(row[i]/top)*(PH-26);
  g.fillStyle="rgba(17,59,49,.12)";g.beginPath();g.moveTo(X(0),PY+PH);for(let i=0;i<=GW;i++)g.lineTo(X(i),py(i));g.lineTo(X(GW),PY+PH);g.fill();
  g.strokeStyle="rgba(17,59,49,.35)";g.lineWidth=0.7;for(let i=0;i<=GW;i+=2){g.beginPath();g.moveTo(X(i),py(i));g.lineTo(X(i),PY+PH);g.stroke()}

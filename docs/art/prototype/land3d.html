  while(pts.length<n&&guard++<600){const x=me(),y=me();if(pts.some(([a,b])=>Math.hypot(a-x,(b-y)*0.6)<0.16))continue;pts.push([x,y])}

function placeAll(o,H,riverX,riverW){const out=[];const camY=H(0,30)+19;

    if(lm.type==="employment"){const b=pick(lr,(r,f)=>{const z=-(92+r()*(70+f*40));return[riverX(z)+(r()<0.5?-1:1)*(riverW(z)+10+r()*40),z,(r()-0.5)*0.8]},5,11);out.push({kind:"cabin",lm,x:b.x,z:b.z,rot:b.extra,clear:11})}
    if(lm.type==="skills"){let best=null;for(let k=0;k<120;k++){const zz=-(96+k*1.1),xx=riverX(zz);if(riverW(zz)>9)continue;const sc=pen(xx,zz,3,12)*10+Math.abs(k-25+lr()*20);if(!best||sc<best[2])best=[xx,zz,sc]}if(!best)best=[riverX(-120),-120];out.push({kind:"bridge",lm,x:best[0],z:best[1],clear:12})}

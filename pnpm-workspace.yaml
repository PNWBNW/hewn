packages:
  - "apps/*"
  - "packages/*"

# Supply-chain guard: never resolve a package version published less than
# 7 days ago. Most malicious npm releases are caught and pulled within days.
minimumReleaseAge: 10080

# Advisories the audit may skip, one at a time, each with its reason (docs/THREAT_MODEL.md T3).
# Remove an entry as soon as a fixed version can be installed.
auditConfig:
  # None today. picomatch's GHSA-fc5q-39xc-vjpf (2026-11-17) came off on 2026-11-25, when the
  # advisory no longer matched any installed version (scripts/check_audit_skips.py said so).
  ignoreGhsas: []

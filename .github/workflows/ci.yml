name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI reads the repo and nothing else. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (lockfile must match exactly)
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Typecheck and build every workspace project
        run: pnpm build
      - name: Dependency audit (fails on moderate or worse)
        run: pnpm audit --audit-level=moderate

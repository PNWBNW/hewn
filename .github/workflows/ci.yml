name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # the Submodule pins workflow starts a run on its bump branch

# Least privilege: CI reads the repo and nothing else. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true # the map draws the Leo programs' repository too (docs/map)
      - name: No keys or tokens in the tree (docs/INVARIANTS.md, INV-06)
        run: python3 -I scripts/check_secrets.py
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install (lockfile must match exactly)
        run: pnpm install --frozen-lockfile
      - name: Tests
        run: pnpm test
      - name: Letters against a real Aleo node (local devnode; docs/VEIL.md)
        run: pnpm --filter @pnw/business test:devnode
      - name: Every write signed in Shield (docs/INVARIANTS.md, INV-11)
        run: python3 -I scripts/check_signing_path.py
      - name: Program names from one place (docs/INVARIANTS.md, INV-12)
        run: python3 -I scripts/check_program_names.py
      - name: Browser storage holds only the five flags (docs/INVARIANTS.md, INV-10)
        run: python3 -I scripts/check_browser_storage.py
      - name: No debug logging in shipped code (docs/INVARIANTS.md, INV-06)
        run: python3 -I scripts/check_console.py
      - name: Retired code is deleted, archive/ holds only its record (docs/INVARIANTS.md, OPS-09)
        run: python3 -I scripts/check_archive.py
      - name: Rules tied to their checks (docs/INVARIANTS.md)
        run: python3 -I scripts/check_invariants.py
      - name: The progress index matches the day files, and every entry is signed
        run: python3 -I scripts/progress_index.py
      - name: Every document has frontmatter and the documents' index matches it (docs/MEMORY.md)
        run: python3 -I scripts/docs_index.py
      - name: Links between the documents point at something
        run: python3 -I scripts/check_links.py
      - name: The map's graphs are sound and their companions current (docs/map)
        run: node docs/map/build.mjs --check
      - name: The map's extractor and queries find the known facts about the tree
        run: node --test docs/map/extract.test.mjs docs/map/query.test.mjs
      - name: Vercel deploys only what changed (scripts/vercel_ignore.mjs)
        run: node --test scripts/vercel_ignore.test.mjs
      - name: Typecheck and build every workspace project
        run: pnpm build
      - name: Static bundle of the app (the installable app's files)
        run: pnpm --filter @pnw/business build:static
      - name: Dependency audit (fails on moderate or worse)
        run: pnpm audit --audit-level=moderate

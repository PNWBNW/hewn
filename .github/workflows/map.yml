name: Map

# The map (docs/map/README.md): built from the tree on every push to main, so a change that breaks
# its build shows on main at once. It is no longer published from here: this repository's GitHub
# Pages site serves the app on its own domain (pages.yml, docs/HOSTING.md step 4), and a
# repository has one Pages site. The map is published from a repository of its own, which builds
# it from this one (docs/map/README.md, "How it's published"). Read-only, no secrets (OPS-05 in
# docs/INVARIANTS.md). The CI gate (ci.yml) checks the map's data on every pull request.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map
  cancel-in-progress: true

jobs:
  build:
    name: Build the map
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true # the map draws the Leo programs' repository too
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install the art package's dependencies (three.js is copied from them)
        run: pnpm install --frozen-lockfile --filter @pnw/art
      - name: Check the graphs and their companions, then build
        run: node docs/map/build.mjs --check && node docs/map/build.mjs

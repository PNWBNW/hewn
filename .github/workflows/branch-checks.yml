name: Branch checks

# Every branch, as soon as it is pushed (not only when a pull request opens): no key or token in
# the tree, and no claude.ai session link in a commit message or a pull request's description
# (CLAUDE.md, Working agreement). Fast and standard library only, so it runs before anything else.
on:
  push:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# Least privilege: reads the repo and the event, nothing else. No secrets are used.
permissions:
  contents: read

concurrency:
  group: branch-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Keys and session links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # the commits of the push or the pull request, and the default branch
      - name: No keys or tokens in the tree (docs/INVARIANTS.md, INV-06)
        run: python3 -I scripts/check_secrets.py
      - name: No session links in commit messages or the pull request's description
        run: python3 -I scripts/check_session_links.py
      - name: The session-link check's own tests
        run: python3 -I scripts/check_session_links_test.py
